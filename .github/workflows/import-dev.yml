name: Import Moily development source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import development branch
        run: |
          git clone --depth 1 --branch develop/moily https://github.com/u-el/oreunaerim-calendar.git "$RUNNER_TEMP/moily-source"
          rsync -a --exclude='.git' --exclude='.github' "$RUNNER_TEMP/moily-source/" ./
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Import isolated development source'
          git push origin main
