name: Moily Firestore rules test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch development source
        run: |
          git clone --depth 1 --branch develop/moily https://github.com/u-el/oreunaerim-calendar.git source
          git -C source rev-parse HEAD
      - name: Install test dependencies
        working-directory: source
        run: npm install --no-save --package-lock=false firebase@11 @firebase/rules-unit-testing@4 firebase-tools@14
      - name: Run isolated rules tests
        working-directory: source
        run: |
          printf '%s\n' '{"firestore":{"rules":"firestore.rules"},"emulators":{"firestore":{"port":8080},"ui":{"enabled":false}}}' > firebase.emulator.json
          npx firebase emulators:exec --config firebase.emulator.json --project demo-moily --only firestore "node tests/firestore-rules-v2.mjs"
